name: Temporary Whisper Model Bundle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch multilingual Whisper base model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p whisper-model
          curl -fL --retry 5 --retry-delay 2 \
            -o whisper-model/ggml-base-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          sha256sum whisper-model/ggml-base-q5_1.bin > whisper-model/SHA256SUMS
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-q5_1
          path: whisper-model
          compression-level: 0
          retention-days: 1
