name: Temporary Speaker Model Bundle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public ECAPA speaker-embedding model
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet huggingface_hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='speechbrain/spkrec-ecapa-voxceleb',
              local_dir='speaker-model',
          )
          PY
          rm -rf speaker-model/.git speaker-model/.cache
      - name: Upload speaker model
        uses: actions/upload-artifact@v4
        with:
          name: speechbrain-ecapa-voxceleb
          path: speaker-model
          compression-level: 0
          retention-days: 1
