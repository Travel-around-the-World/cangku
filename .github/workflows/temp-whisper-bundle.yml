name: Temporary Whisper Bundle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build whisper.cpp and fetch multilingual model
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF
          cmake --build whisper.cpp/build --config Release -j2
          mkdir -p whisper-bundle/models
          cp whisper.cpp/build/bin/whisper-cli whisper-bundle/
          curl -fL --retry 5 --retry-delay 2 \
            -o whisper-bundle/models/ggml-small-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          chmod +x whisper-bundle/whisper-cli
          sha256sum whisper-bundle/models/ggml-small-q5_1.bin > whisper-bundle/SHA256SUMS
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: whisper-linux-small-q5_1
          path: whisper-bundle
          compression-level: 0
          retention-days: 1
